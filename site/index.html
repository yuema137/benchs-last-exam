<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchmark Observatory</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">BENCHMARK OBSERVATORY · LOCAL PREVIEW</p>
      <h1>Leaderboard of Benchmarks</h1>
      <p class="lede">Models are probes. The benchmark is the object we compare.</p>
    </header>
    <section class="controls" aria-label="Chart controls">
      <label>X axis <select id="x-axis"><option value="age">Since release</option><option value="calendar">Calendar date</option></select></label>
      <label>Y axis <select id="y-axis"><option value="raw">Raw score</option><option value="normalized">Normalized progress</option></select></label>
      <label>Sort by <select id="sort"><option value="release">Age</option><option value="current_frontier">Current SOTA</option><option value="headroom">Headroom</option><option value="t50">T50</option><option value="t90">T90</option><option value="coverage">Coverage</option></select></label>
      <span class="snapshot" id="snapshot"></span>
    </section>
    <div class="notice">Health and evaluation coverage are shown separately. Low coverage means the benchmark may be under-evaluated.</div>
    <section id="cards" class="cards" aria-live="polite"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
